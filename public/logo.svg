<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7737A" />
      <stop offset="50%" stop-color="#C48B8B" />
      <stop offset="100%" stop-color="#9C5963" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F48FB1" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background container with soft rounded corners -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="#F8C8D8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Monogram LL circle badge -->
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="url(#roseGold)" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="43" fill="none" stroke="#F8C8D8" stroke-width="1" />
    <!-- Heart accent -->
    <path d="M -3 -16 C -6 -21, -14 -18, -14 -12 C -14 -6, -3 2, 0 5 C 3 2, 14 -6, 14 -12 C 14 -18, 6 -21, 3 -16 Z" fill="#F48FB1" opacity="0.35" transform="scale(0.7) translate(-36, -10)" />
    
    <!-- Monogram letters L L -->
    <text x="-12" y="16" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="44" font-weight="500" fill="url(#roseGold)" text-anchor="middle" font-style="italic">L</text>
    <text x="12" y="19" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="46" font-weight="600" fill="#9C5963" text-anchor="middle" font-style="italic">L</text>
  </g>

  <!-- Brand Name Lufae -->
  <text x="200" y="245" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="64" font-weight="600" fill="#3A1F2B" text-anchor="middle" letter-spacing="2">Lufae</text>
  
  <!-- Subtle decorative heart line -->
  <path d="M 80 230 C 85 224, 95 226, 95 232 C 95 238, 85 244, 82 246 C 80 244, 70 238, 70 232 C 70 226, 80 224, 80 230 Z" fill="#EC407A" opacity="0.4" transform="scale(0.8) translate(30, 48)" />

  <!-- Subtitle Luiza Leal -->
  <g transform="translate(200, 282)">
    <line x1="-100" y1="0" x2="-62" y2="0" stroke="#C48B8B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="-58" cy="0" r="1.5" fill="#C48B8B" />
    <text x="0" y="4" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#7A5563" text-anchor="middle" letter-spacing="5">LUIZA LEAL</text>
    <circle cx="58" cy="0" r="1.5" fill="#C48B8B" />
    <line x1="62" y1="0" x2="100" y2="0" stroke="#C48B8B" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Tagline Acessórios -->
  <text x="200" y="325" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#C48B8B" text-anchor="middle" letter-spacing="4">ACESSÓRIOS &amp; JOIAS</text>
</svg>
